<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Gallery | Vachan U S</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-primary: #8b5cf6;
      --accent-secondary: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #3b82f6, #06b6d4);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      padding-bottom: 5rem;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 1.5rem 2rem;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 9999px;
      color: #c4b5fd;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 700px;
      margin: 0 auto 2rem;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .nav-links a {
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.5rem 1.1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-links a:hover {
      background: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Filter pills */
    .filters {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.5rem 1.25rem;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #8b5cf6;
      color: #fff;
      border-color: #8b5cf6;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
    }

    /* Gallery Grid */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(139, 92, 246, 0.4);
      box-shadow: 0 12px 30px -10px rgba(139, 92, 246, 0.25);
    }

    .card-img-wrap {
      width: 100%;
      height: 240px;
      overflow: hidden;
      position: relative;
      background: #111;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.4s ease;
    }

    .card:hover .card-img-wrap img {
      transform: scale(1.05);
    }

    .card-content {
      padding: 1.25rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #38bdf8;
      margin-bottom: 0.4rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 12, 0.92);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      max-width: 900px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      object-fit: contain;
    }

    .modal-caption {
      margin-top: 1rem;
      text-align: center;
      color: #e2e8f0;
      font-size: 1.05rem;
    }

    .close-btn {
      position: absolute;
      top: -40px;
      right: 0;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
      background: transparent;
      border: none;
      line-height: 1;
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--card-border);
    }

    footer a {
      color: #a78bfa;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">Official Showcase</span>
    <h1>Workshop & Masterclass Gallery</h1>
    <p class="subtitle">A visual chronicle of technology workshops, hands-on masterclasses, developer hackathons, and certifications attended by Vachan U S.</p>
    
    <div class="nav-links">
      <a href="https://github.com/vachan18/Workshop-gallery" target="_blank">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub Repository
      </a>
      <a href="https://vachan18.github.io" target="_blank">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        Personal Portfolio
      </a>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All Events (13)</button>
      <button class="filter-btn" data-filter="genai">Microsoft AI Masterclass</button>
      <button class="filter-btn" data-filter="thb">THB × Bhindi</button>
      <button class="filter-btn" data-filter="bitgo">BitGo Web3</button>
      <button class="filter-btn" data-filter="360">360DigiTMG AI Certification</button>
    </div>
  </header>

  <main>
    <div class="gallery-grid" id="gallery">
      <!-- Cards will be populated here -->
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close-btn" id="modal-close">&times;</button>
      <img src="" alt="" id="modal-img">
      <div class="modal-caption" id="modal-caption"></div>
    </div>
  </div>

  <footer>
    <p>Curated with ❤️ by <a href="https://github.com/vachan18">Vachan U S</a> • Hosted on GitHub Pages</p>
  </footer>

  <script>
    const items = [
      {
        src: 'Gen AI 2.jpg',
        category: 'genai',
        categoryLabel: 'Microsoft & Reliance Digital',
        title: 'Event Entrance & Masterclass Launchpad',
        desc: 'Vachan at the Microsoft & Reliance Digital AI Playground Masterclass.'
      },
      {
        src: 'Gen AI 1.jpg',
        category: 'genai',
        categoryLabel: 'Microsoft & Reliance Digital',
        title: 'Masterclass Cohort & Tech Mentors',
        desc: 'Group picture with attendees and industry organizers at the AI Masterclass.'
      },
      {
        src: '1758649544104.jpg',
        category: 'genai',
        categoryLabel: 'Microsoft & Reliance Digital',
        title: 'Generative AI Architecture Session',
        desc: 'Technical presentation covering cloud computing, NLP pipelines, and generative AI models.'
      },
      {
        src: '1759129207695.jpg',
        category: 'thb',
        categoryLabel: 'THB × Bhindi × altrd',
        title: 'Attendee Delegate Badge',
        desc: 'Official participant pass for Vachan at the tech & creative innovation meetup.'
      },
      {
        src: '1759129203768.jpg',
        category: 'thb',
        categoryLabel: 'THB × Bhindi × altrd',
        title: 'Interactive AI Robot ("Talk To Me")',
        desc: 'Exploring an expressive physical robotics installation with real-time AI conversation.'
      },
      {
        src: '1759129206364.jpg',
        category: 'thb',
        categoryLabel: 'THB × Bhindi × altrd',
        title: 'Stage Cohort & Organizers',
        desc: 'Group photo on stage alongside session host Gayatri Agrawal and community leaders.'
      },
      {
        src: '1760202555746.jpg',
        category: 'bitgo',
        categoryLabel: 'BitGo Infrastructure',
        title: 'BitGo Hands-on Developer Session',
        desc: 'Diving deep into digital asset infrastructure, enterprise multi-sig, and custody architecture.'
      },
      {
        src: '1760202556799.jpg',
        category: 'bitgo',
        categoryLabel: 'BitGo Infrastructure',
        title: 'Developer Cohort at BitGo',
        desc: 'Developer attendees group photo outside BitGo headquarters with event goodies.'
      },
      {
        src: '1760202557810.jpg',
        category: 'bitgo',
        categoryLabel: 'BitGo Infrastructure',
        title: 'BitGo Headquarters at Night',
        desc: 'Illuminated BitGo campus after a comprehensive evening developer session.'
      },
      {
        src: '1760790465203.jpg',
        category: '360',
        categoryLabel: '360DigiTMG / AiSPRY',
        title: 'Certificate of Participation',
        desc: 'Generative AI for Everyone certificate awarded to Vachan U S.'
      },
      {
        src: '1760790461570.jpg',
        category: '360',
        categoryLabel: '360DigiTMG / AiSPRY',
        title: 'Certificate Felicitation Ceremony',
        desc: 'Receiving the participation certificate from lead instructors at 360DigiTMG.'
      },
      {
        src: '1760790467527.jpg',
        category: '360',
        categoryLabel: '360DigiTMG / AiSPRY',
        title: 'Gemini AI Automation Workflow',
        desc: 'Hands-on Make.com workflow automating Google Gemini AI completions into Google Sheets.'
      },
      {
        src: '1760790461213.jpg',
        category: '360',
        categoryLabel: '360DigiTMG / AiSPRY',
        title: 'Workshop Cohort Photo',
        desc: 'Group photograph with participants and trainers of the Generative AI workshop.'
      }
    ];

    const gallery = document.getElementById('gallery');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalCaption = document.getElementById('modal-caption');
    const modalClose = document.getElementById('modal-close');

    function renderGallery(filter = 'all') {
      gallery.innerHTML = '';
      const filtered = filter === 'all' ? items : items.filter(i => i.category === filter);
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${item.src}" alt="${item.title}" loading="lazy" />
          </div>
          <div class="card-content">
            <span class="card-category">${item.categoryLabel}</span>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-desc">${item.desc}</p>
          </div>
        `;
        card.addEventListener('click', () => {
          modalImg.src = item.src;
          modalCaption.textContent = `${item.title} — ${item.desc}`;
          modal.classList.add('open');
        });
        gallery.appendChild(card);
      });
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.dataset.filter);
      });
    });

    modalClose.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    renderGallery();
  </script>
</body>
</html>
